<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost.MarketingBot</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
</head>
<body>
    <section class="hero">
        <h1>Ghost.<span class="gold">MarketingBot</span></h1>
        <p>Automatisierter Kundenscanner für dich</p>
        <img src="https://raw.githubusercontent.com/NisaZekaj/ghostai-classic-/main/F4D5F994-3ED7-441C-BB67-7E6E7D3A9457.png" alt="AI Bot" class="bot-image" />
    </section>

    <section class="scanner">
        <h2>Wen möchtest du erreichen?</h2>
        <input type="text" id="zielgruppe" placeholder="z.B. Fitness Coach, Online-Shop..." />
        <button onclick="starteBot()">MarketingBot starten</button>
        <p id="status" class="status-text"></p>
    </section>

    <section id="kontaktformular" class="kontakt-formular" style="display:none;">
        <h2>Interessent erkannt – Kontaktdaten erfassen</h2>
        <input type="text" placeholder="Name" />
        <input type="email" placeholder="E-Mail" />
        <textarea placeholder="Was brauchst du?"></textarea>
        <button>Absenden</button>
    </section>
</body>
</html>
